name: Notify IndexNow on Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Wait for GitHub Pages propagation
        run: sleep 45

      - name: Submit all sitemap URLs to IndexNow (Bing / ChatGPT / Yandex)
        run: |
          python3 - <<'EOF'
          import json, re, urllib.request

          sitemap = open("sitemap.xml", encoding="utf-8").read()
          urls = re.findall(r"<loc>(.*?)</loc>", sitemap)
          for extra in [
              "https://njenga.ai/llms.txt",
              "https://njenga.ai/llms-full.txt",
              "https://njenga.ai/resume.json",
              "https://njenga.ai/feed.xml",
          ]:
              if extra not in urls:
                  urls.append(extra)

          payload = {
              "host": "njenga.ai",
              "key": "36e17b8d614ee66de549502c4dd9eadc",
              "keyLocation": "https://njenga.ai/36e17b8d614ee66de549502c4dd9eadc.txt",
              "urlList": urls,
          }
          req = urllib.request.Request(
              "https://api.indexnow.org/IndexNow",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              print("IndexNow status:", resp.status, "URLs submitted:", len(urls))
          EOF
